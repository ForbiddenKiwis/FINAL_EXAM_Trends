version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    volumes:
      - sqlite_data:/app/Data
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    restart: always

volumes:
  sqlite_data: